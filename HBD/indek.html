<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday {{ name }}!</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Mitr', sans-serif;
            text-align: center;
            overflow: hidden;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            max-width: 500px;
            width: 90%;
            animation: popIn 1s ease-out;
            position: relative;
            z-index: 10;
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        h1 {
            font-family: 'Pacifico', cursive;
            color: #ff4757;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        h2 {
            color: #2ed573;
            font-size: 1.8rem;
            margin-bottom: 20px;
        }

        p {
            color: #57606f;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .cake-emoji {
            font-size: 4rem;
            margin-bottom: 15px;
            animation: bounce 1.5s infinite alternate;
        }

        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-15px); }
        }

        .btn {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.1rem;
            font-family: 'Mitr', sans-serif;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
            transition: all 0.3s ease;
        }

        .btn:hover {
            background-color: #ff6b81;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 71, 87, 0.6);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="cake-emoji">🎂🎉✨</div>
        <h1>Happy Birthday!</h1>
        <h2>{คุณพ่อ}</h2>
        <p>{ขอให้มีความสุขมากๆ สุขภาพแข็งแรง คิดสิ่งใดขอให้สมปรารถนา และมีความสุขในทุกๆ วันนะ}</p>
        <button class="btn" onclick="fireConfetti()">กดเพื่อรับพรพิเศษ 🎁</button>
    </div>

    <script>
        // ยิงพลุกระดาษเมื่อโหลดหน้าเว็บ
        window.onload = function() {
            fireConfetti();
        };

        // ฟังก์ชันยิงพลุกระดาษ (Confetti)
        function fireConfetti() {
            var duration = 3 * 1000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 }
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 }
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }
    </script>
</body>
</html>
