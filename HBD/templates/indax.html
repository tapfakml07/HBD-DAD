<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Mitr', sans-serif;
            text-align: center;
            margin: 0;
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            max-width: 400px;
            width: 85%;
        }
        h1 { font-family: 'Pacifico', cursive; color: #ff4757; font-size: 2.2rem; }
        h2 { color: #2ed573; font-size: 1.6rem; }
        p { color: #57606f; font-size: 1rem; line-height: 1.6; }
        .cake { font-size: 4rem; margin-bottom: 10px; }
        .btn {
            background-color: #ff4757; color: white; border: none;
            padding: 12px 25px; font-size: 1rem; border-radius: 50px;
            cursor: pointer; font-family: 'Mitr', sans-serif;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="cake">🎂🎉✨</div>
        <h1>Happy Birthday!</h1>
        <h2> คุณพ่อ </h2>
        <p> ขอให้มีความสุขมากๆ สุขภาพแข็งแรง คิดสิ่งใดขอให้สมปรารถนา และมีความสุขในทุกๆ วันนะ </p>
        <button class="btn" onclick="fireConfetti()">กดเพื่อรับพรพิเศษ 🎁</button>
    </div>
    <script>
        window.onload = function() { fireConfetti(); };
        function fireConfetti() {
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        }
    </script>
</body>
</html>
